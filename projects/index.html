<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기타 웹사이트</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #fff7ed, #fffbeb 45%, #f8fafc);
        font-family: "Noto Sans KR", sans-serif;
        color: #1f2937;
      }
      .box {
        width: min(760px, calc(100% - 32px));
        background: #fffffff0;
        border: 1px solid #fed7aa;
        border-radius: 16px;
        padding: 28px;
      }
      h1 { margin-top: 0; }
      p { color: #475569; line-height: 1.7; }
      a { color: #c2410c; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>기타 웹사이트</h1>
      <p>실험용 웹 앱, 도구, 데모 등 추가 사이트를 이 경로에 구성하면 됩니다.</p>
      <p><a href="../">통합 포털로 돌아가기</a></p>
    </main>
  </body>
</html>
