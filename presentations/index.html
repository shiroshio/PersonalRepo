<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>발표자료 모음</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f0fdfa, #ecfeff 45%, #f8fafc);
        font-family: "Noto Sans KR", sans-serif;
        color: #0f172a;
      }
      .box {
        width: min(760px, calc(100% - 32px));
        background: #ffffffcc;
        backdrop-filter: blur(4px);
        border: 1px solid #bae6fd;
        border-radius: 16px;
        padding: 28px;
      }
      h1 { margin-top: 0; }
      p { color: #334155; line-height: 1.7; }
      a { color: #0f766e; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>발표자료 모음</h1>
      <p>이 폴더에 발표용 HTML/슬라이드 파일을 추가해 통합 포털에서 관리할 수 있습니다.</p>
      <p><a href="../">통합 포털로 돌아가기</a></p>
    </main>
  </body>
</html>
