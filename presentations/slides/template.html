<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Presentation Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
    <style>
      :root {
        --page-bg: #f2ecde;
        --panel-bg: #fffaf0;
        --panel-line: #d6ccb7;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-hover: #0b5f59;
        --slide-font-size: 38px;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 90% -10%, rgb(15 118 110 / 0.12), transparent 30%),
          radial-gradient(circle at 0% 100%, rgb(194 65 12 / 0.08), transparent 25%),
          var(--page-bg);
        color: var(--ink);
      }

      .toolbar {
        position: fixed;
        top: 54px;
        left: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        background: #ffffffe6;
        border: 1px solid var(--panel-line);
        border-radius: 12px;
        padding: 10px;
        backdrop-filter: blur(6px);
        opacity: 0;
        transform: translateY(-14px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .toolbar.open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .toolbar-toggle {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 30;
        border: 1px solid var(--panel-line);
        border-radius: 999px;
        background: #fffffff0;
        color: var(--ink);
        padding: 7px 12px;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }

      .toolbar-toggle:hover {
        background: #ffffff;
      }

      .toolbar a,
      .toolbar button,
      .toolbar select,
      .toolbar label {
        font: inherit;
        font-size: 0.86rem;
      }

      .toolbar a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 700;
      }

      .toolbar select,
      .toolbar button,
      .toolbar label {
        border: 1px solid var(--panel-line);
        border-radius: 8px;
        background: #fff;
        padding: 7px 10px;
      }

      .toolbar button,
      .toolbar label {
        cursor: pointer;
      }

      .toolbar .cta {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .toolbar .cta:hover {
        background: var(--accent-hover);
      }

      .toolbar .muted {
        color: var(--muted);
      }

      .font-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .font-controls output {
        min-width: 54px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
      }

      .reveal {
        --r-main-font-size: var(--slide-font-size);
        margin-top: 8px;
        transition: margin-top 0.2s ease;
      }

      body.toolbar-open .reveal {
        margin-top: 66px;
      }

      .reveal .slides {
        text-align: left;
      }

      .reveal .slides section {
        background: var(--panel-bg);
        border: 1px solid var(--panel-line);
        border-radius: 16px;
        padding: 30px;
      }

      .reveal h1,
      .reveal h2,
      .reveal h3,
      .reveal p,
      .reveal li {
        color: var(--ink);
      }

      .reveal pre code {
        max-height: 70vh;
        background: #f3ede0;
        border: 1px solid #e2d8c2;
        border-radius: 8px;
      }

      .reveal .mermaid {
        border: 1px solid #e2d8c2;
        border-radius: 10px;
        background: #f8f3e8;
        padding: 14px;
        overflow: auto;
      }

      .reveal .mermaid svg {
        max-width: 100%;
        height: auto;
      }

      .reveal blockquote {
        border-left: 4px solid #d6ccb7;
        padding-left: 14px;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .toolbar {
          left: 8px;
          right: 8px;
          top: 50px;
        }

        body.toolbar-open .reveal {
          margin-top: 78px;
        }
      }
    </style>
  </head>
  <body>
    <button id="toolbar-toggle" class="toolbar-toggle" type="button">도구 열기</button>

    <div id="toolbar" class="toolbar" aria-hidden="true">
      <a href="../">← 발표자료 모음으로</a>
      <span class="muted">|</span>
      <select id="report-select"></select>
      <button id="load-report-btn" type="button">에디터 리포트 불러오기</button>
      <div class="font-controls">
        <button id="font-down-btn" type="button" title="글자 크기 축소">A-</button>
        <output id="font-size-text">38px</output>
        <button id="font-up-btn" type="button" title="글자 크기 확대">A+</button>
      </div>
      <label for="md-file-input" class="cta">md 파일 열기</label>
      <input id="md-file-input" type="file" accept=".md,text/markdown" hidden />
      <a class="muted" href="?md=example.md">example 로드</a>
    </div>

    <div class="reveal">
      <div class="slides">
        <section
          id="markdown-slide-root"
          data-markdown="example.md"
          data-separator="^\s*---\s*$"
          data-separator-vertical="^\s*--\s*$"
          data-separator-notes="^Note:"
        ></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/math/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
      const KEY_REPORTS = "report_app_reports_v1";
      const KEY_RUNTIME_MD = "presentation_runtime_md_v1";
      const KEY_SLIDE_FONT_SIZE = "presentation_slide_font_size_v1";
      const MIN_FONT_SIZE = 18;
      const MAX_FONT_SIZE = 52;
      const rootSection = document.getElementById("markdown-slide-root");
      const reportSelect = document.getElementById("report-select");
      const loadReportBtn = document.getElementById("load-report-btn");
      const mdFileInput = document.getElementById("md-file-input");
      const toolbar = document.getElementById("toolbar");
      const toolbarToggleBtn = document.getElementById("toolbar-toggle");
      const fontDownBtn = document.getElementById("font-down-btn");
      const fontUpBtn = document.getElementById("font-up-btn");
      const fontSizeText = document.getElementById("font-size-text");
      const params = new URLSearchParams(window.location.search);

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getSavedFontSize() {
        try {
          const n = Number(localStorage.getItem(KEY_SLIDE_FONT_SIZE));
          if (Number.isFinite(n)) {
            return clamp(n, MIN_FONT_SIZE, MAX_FONT_SIZE);
          }
        } catch {}
        return 38;
      }

      function applyFontSize(size) {
        const clamped = clamp(size, MIN_FONT_SIZE, MAX_FONT_SIZE);
        document.documentElement.style.setProperty("--slide-font-size", `${clamped}px`);
        fontSizeText.value = `${clamped}px`;
        try {
          localStorage.setItem(KEY_SLIDE_FONT_SIZE, String(clamped));
        } catch {}
      }

      function setToolbarOpen(open) {
        toolbar.classList.toggle("open", open);
        toolbar.setAttribute("aria-hidden", open ? "false" : "true");
        document.body.classList.toggle("toolbar-open", open);
        toolbarToggleBtn.textContent = open ? "도구 닫기" : "도구 열기";
      }

      function readReports() {
        try {
          const raw = localStorage.getItem(KEY_REPORTS);
          const parsed = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed.filter((item) => item && typeof item.id === "string" && typeof item.title === "string");
        } catch {
          return [];
        }
      }

      function setMarkdownSource(path) {
        rootSection.setAttribute("data-markdown", path);
      }

      function createMarkdownBlobUrl(markdownText) {
        const blob = new Blob([markdownText], { type: "text/markdown;charset=utf-8" });
        return URL.createObjectURL(blob);
      }

      function normalizeLatexForSlides(markdownText) {
        const src = String(markdownText || "");

        // In some Reveal Markdown flows, row separators can lose escaping.
        // Normalize line-end backslashes inside common multiline LaTeX environments to exactly \\\\.
        return src.replace(
          /\\begin\{(bmatrix|pmatrix|vmatrix|Bmatrix|matrix|array|cases|aligned|align|split)\}([\s\S]*?)\\end\{\1\}/g,
          (full, env, body) => {
            const fixedBody = body.replace(/\\+\s*(\r?\n)/g, "\\\\\\\\$1");
            return `\\begin{${env}}${fixedBody}\\end{${env}}`;
          }
        );
      }

      function setRuntimeMarkdown(markdownText) {
        localStorage.setItem(KEY_RUNTIME_MD, markdownText || "");
      }

      function loadRuntimeMarkdownAsBlob() {
        const source = localStorage.getItem(KEY_RUNTIME_MD) || "# Empty Slide\n\n내용이 없습니다.";
        return createMarkdownBlobUrl(normalizeLatexForSlides(source));
      }

      async function resolveMarkdownSourceUrl(requestedSource) {
        if (requestedSource === "runtime") {
          return loadRuntimeMarkdownAsBlob();
        }

        try {
          const response = await fetch(requestedSource, { cache: "no-store" });
          if (!response.ok) {
            return requestedSource;
          }
          const text = await response.text();
          return createMarkdownBlobUrl(normalizeLatexForSlides(text));
        } catch {
          return requestedSource;
        }
      }

      function initializeMermaid() {
        if (!window.mermaid) {
          return;
        }
        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: "base",
          themeVariables: {
            background: "#f8f3e8",
            primaryTextColor: "#1f2937",
            lineColor: "#475569",
            textColor: "#1f2937"
          }
        });
      }

      function looksLikeMermaid(source) {
        const text = (source || "").trim();
        if (!text) {
          return false;
        }

        return /^(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram|erDiagram|journey|gantt|pie|mindmap|timeline|gitGraph|quadrantChart|xychart-beta|requirementDiagram|C4Context|C4Container|C4Component|C4Dynamic|C4Deployment)\b/m.test(text);
      }

      function renderMermaidBlocks() {
        if (!window.mermaid) {
          return;
        }

        const blocks = Array.from(document.querySelectorAll(".reveal pre code")).filter((code) => {
          const className = code.className || "";
          const source = code.textContent || "";
          const classMatched = /(^|\s)(language-)?mermaid(\s|$)/i.test(className);
          return classMatched || looksLikeMermaid(source);
        });

        if (blocks.length === 0) {
          return;
        }

        blocks.forEach((code, idx) => {
          const pre = code.closest("pre");
          if (!pre) {
            return;
          }

          if (pre.dataset.mermaidProcessed === "true") {
            return;
          }

          const wrapper = document.createElement("div");
          wrapper.className = "mermaid";
          const source = (code.textContent || "").trim();
          wrapper.textContent = source;
          pre.replaceWith(wrapper);
          pre.dataset.mermaidProcessed = "true";

          const id = `slide-mermaid-${Date.now()}-${idx}`;
          window.mermaid.render(id, source).then((result) => {
            wrapper.innerHTML = result.svg;
            if (typeof result.bindFunctions === "function") {
              result.bindFunctions(wrapper);
            }
          }).catch(() => {
            // Keep source text visible on render errors.
          });
        });
      }

      function initReportSelector() {
        const reports = readReports().sort((a, b) =>
          String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""))
        );

        if (reports.length === 0) {
          reportSelect.innerHTML = '<option value="">에디터 리포트 없음</option>';
          loadReportBtn.disabled = true;
          return;
        }

        reportSelect.innerHTML = reports
          .map((report) => `<option value="${report.id}">${escapeHtml(report.title)}</option>`)
          .join("");

        loadReportBtn.disabled = false;

        loadReportBtn.addEventListener("click", () => {
          const targetId = reportSelect.value;
          const report = reports.find((item) => item.id === targetId);
          if (!report) {
            return;
          }

          setRuntimeMarkdown(report.content || `# ${report.title}`);
          window.location.search = "?md=runtime";
        });
      }

      mdFileInput.addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }

        const text = await file.text();
        setRuntimeMarkdown(text);
        event.target.value = "";
        window.location.search = "?md=runtime";
      });

      fontDownBtn.addEventListener("click", () => {
        applyFontSize(getSavedFontSize() - 2);
      });

      fontUpBtn.addEventListener("click", () => {
        applyFontSize(getSavedFontSize() + 2);
      });

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function initPresentation() {
        const requestedSource = params.get("md") || "example.md";
        const resolvedSource = await resolveMarkdownSourceUrl(requestedSource);
        setMarkdownSource(resolvedSource);

        initReportSelector();
        applyFontSize(getSavedFontSize());
        setToolbarOpen(false);

        toolbarToggleBtn.addEventListener("click", () => {
          const next = !toolbar.classList.contains("open");
          setToolbarOpen(next);
        });

        const deck = new Reveal({
          hash: true,
          slideNumber: true,
          transition: "slide",
          plugins: [RevealMarkdown, RevealMath.KaTeX],
          markdown: {
            smartypants: true
          }
        });

        initializeMermaid();
        await deck.initialize();
        renderMermaidBlocks();
        deck.on("ready", () => {
          renderMermaidBlocks();
        });
        deck.on("slidechanged", () => {
          renderMermaidBlocks();
        });
      }

      initPresentation();
    </script>
  </body>
</html>
