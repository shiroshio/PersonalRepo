<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Presentation Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
    <style>
      .reveal .slides section[data-markdown] {
        text-align: left;
      }

      .reveal pre code {
        max-height: 70vh;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section>
          <section
            data-markdown="example.md"
            data-separator="^\n---\n$"
            data-separator-vertical="^\n--\n$"
            data-separator-notes="^Note:"
          ></section>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/math/math.js"></script>
    <script>
      const deck = new Reveal({
        hash: true,
        slideNumber: true,
        transition: "slide",
        plugins: [RevealMarkdown, RevealMath.KaTeX],
        markdown: {
          smartypants: true
        }
      });
      deck.initialize();
    </script>
  </body>
</html>
