<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>위상수학 기초 세미나</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section>
          <h1>위상수학 기초 세미나</h1>
          <p>열린집합, 연속성, 위상동형</p>
          <small>2026-03-20</small>
        </section>

        <section>
          <h2>핵심 질문</h2>
          <ul>
            <li>거리 개념 없이도 연속성을 정의할 수 있을까?</li>
            <li>머그컵과 도넛은 왜 위상적으로 같은가?</li>
            <li>실분석과 위상수학은 어떻게 연결되는가?</li>
          </ul>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script>
      const deck = new Reveal({ hash: true, slideNumber: true, transition: "slide" });
      deck.initialize();
    </script>
  </body>
</html>
