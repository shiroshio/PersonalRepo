<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연구실 주간 미팅 - 실험 업데이트</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section>
          <h1>연구실 주간 미팅</h1>
          <p>실험 진행 상황 및 다음 액션</p>
          <small>2026-03-22</small>
        </section>

        <section>
          <h2>이번 주 업데이트</h2>
          <ul>
            <li>데이터 수집 파이프라인 자동화 1차 완료</li>
            <li>모델 정확도 0.89 → 0.92 향상</li>
            <li>다음 주: 에러 케이스 분석 및 재학습</li>
          </ul>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script>
      const deck = new Reveal({ hash: true, slideNumber: true, transition: "slide" });
      deck.initialize();
    </script>
  </body>
</html>
